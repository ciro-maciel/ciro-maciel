        <!-- O tema antes da primeira pintura. Lê a escolha guardada pelo botão
             de tema (Automático, Claro, Escuro) ou, sem escolha, o tema do
             aparelho, e marca o <html> antes do CSS — sem isto o escuro piscaria
             branco a cada carga. É o mesmo cálculo do MantineProvider. -->
        <script>try{var s=localStorage.getItem('mantine-color-scheme-value');var d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-mantine-color-scheme',d?'dark':'light')}catch(e){}</script>

    <!-- Montserrat comes from this site (src/fonts.css): preloaded here so it
         arrives with the CSS and the first paint is already in the site's
         font. Vite rewrites the path to the hashed file. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/fonts/montserrat-latin.woff2"
      crossorigin
    />

    <!-- Operations Analytics — sem cookie, sem banner de consentimento.
         `defer` não atrasa o LCP; `data-spa="auto"` conta cada troca de rota
         do React Router, sem ele só o primeiro carregamento apareceria. O
         `data-site` é o id do site no painel, não é segredo. -->
    <script
      defer
      src="https://analytics.worker.myoperations.click/tracker.js"
      data-site="0cd6458b-7ab5-41df-95ec-43a09388e26c"
      data-spa="auto"
      data-honor-dnt="true"
    ></script>
